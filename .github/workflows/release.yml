name: Release

on:
  push:
    tags:
      - "v*"
      - "beta_*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format and determine channel
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^beta_([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$TAG' does not match the required v<major>.<minor>.<patch> or beta_<major>.<minor>.<patch> format"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Find previous release on this channel
        id: prev
        run: |
          if [ "${{ steps.tag.outputs.channel }}" = "stable" ]; then
            PATTERN='v[0-9]*.[0-9]*.[0-9]*'
          else
            PATTERN='beta_[0-9]*.[0-9]*.[0-9]*'
          fi
          PREV=$(git tag -l "$PATTERN" --sort=-creatordate | grep -v "^${{ steps.tag.outputs.tag }}$" | head -n 1 || true)
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.channel == 'stable' && format('{0}:{1}', env.IMAGE_NAME, steps.tag.outputs.version) || format('{0}:{1}-beta', env.IMAGE_NAME, steps.tag.outputs.version) }}
            ${{ steps.tag.outputs.channel == 'stable' && format('{0}:latest', env.IMAGE_NAME) || format('{0}:beta', env.IMAGE_NAME) }}
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS_TAG" --jq .body > release-notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > release-notes.md
          fi

          {
            echo "## Docker image"
            echo ""
            echo '```'
            if [ "$CHANNEL" = "stable" ]; then
              echo "docker pull ${IMAGE_NAME}:${VERSION}"
              echo "docker pull ${IMAGE_NAME}:latest"
            else
              echo "docker pull ${IMAGE_NAME}:${VERSION}-beta"
              echo "docker pull ${IMAGE_NAME}:beta"
            fi
            echo '```'
            echo ""
            cat release-notes.md
          } > release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          FLAGS=(--title "$TAG" --notes-file release-body.md)
          if [ "$CHANNEL" = "beta" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}"
